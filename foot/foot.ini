# -*- conf -*-
# Foot configuration for Sway on Arch Linux (Enhanced Styling)

include=/home/suiseika/.config/foot/themes/mars-twilight.ini

shell=/usr/bin/fish

font=JetBrainsMono Nerd Font:size=15
font-bold=JetBrainsMono Nerd Font:size=15:weight=bold
font-italic=JetBrainsMono Nerd Font:size=15:slant=italic
font-bold-italic=JetBrainsMono Nerd Font:size=15:weight=bold:slant=italic
line-height=22.5
letter-spacing=0.2

pad=16x16 center
resize-delay-ms=0
resize-by-cells=no

[environment]
TERM=foot
COLORTERM=truecolor

[url]
launch=xdg-open ${url}
osc8-underline=always
style=curly

[bell]
urgent=yes
notify=no

[scrollback]
lines=10000
multiplier=5.0

[cursor]
style=beam
blink=yes
beam-thickness=1.5

[colors-dark]
alpha=0.88

[mouse]
hide-when-typing=yes

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
primary-paste=Shift+Insert
search-start=Control+Shift+r
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
spawn-terminal=Control+Shift+n
show-urls-launch=Control+Shift+o Control+Shift+l
pipe-scrollback=[wl-copy] Control+Shift+a Control+a
scrollback-up-half-page=Control+Shift+Up
scrollback-down-half-page=Control+Shift+Down

[mouse-bindings]
select-extend-character-wise=none
show-urls-launch=Control+BTN_RIGHT
scrollback-up-half-page=Mod1+BTN_WHEEL_BACK
scrollback-down-half-page=Mod1+BTN_WHEEL_FORWARD
