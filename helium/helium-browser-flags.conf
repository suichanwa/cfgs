--ozone-platform-hint=auto
--disable-features=WaylandFractionalScaleV1,Vulkan,CalculateNativeWinOcclusion
--enable-features=VaapiVideoDecodeLinuxGL,VaapiVideoDecoder,WebRTCPipeWireCapturer,WaylandWindowDecorations
--disable-backgrounding-occluded-windows
--disable-background-timer-throttling
--disable-renderer-backgrounding
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy
--force-dark-mode
